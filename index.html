const mx=n=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(n||0); const fd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12,0,0)}; const ds=s=>fd(s).toLocaleDateString('es-MX',{day:'numeric',month:'short',year:'numeric'}); const iso=d=>{const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}; const today=()=>iso(new Date());
function save(){localStorage.setItem(KEY,JSON.stringify(debts));render()} function all(){return debts.flatMap(d=>d.payments.map(p=>({...p,debtId:d.id,debt:d.name}))) } function pending(){return all().filter(p=>!p.paid).sort((a,b)=>a.date.localeCompare(b.date))}
function status(p){let dif=Math.ceil((fd(p.date)-fd(today()))/86400000);if(p.paid)return['Pagado','ok'];if(dif<0)return['Vencido','late'];if(dif===0)return['Vence hoy','soon'];if(dif<=3)return[`En ${dif} día${dif==1?'':'s'}`,'soon'];return[ds(p.date),'future']}
function render(){document.getElementById('today').textContent=new Date().toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long',year:'numeric'});document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===current));let v=document.getElementById('view');if(current==='home')home(v);if(current==='debts')debtView(v);if(current==='calendar')calendar(v);if(current==='history')history(v);alerts()}
function weekBounds(offset=0){let base=fd(today()),day=base.getDay(),delta=day===0?-6:1-day;let start=new Date(base);start.setDate(base.getDate()+delta+(offset*7));let end=new Date(start);end.setDate(start.getDate()+6);return [iso(start),iso(end)]} function weekLabel(a,b){let A=fd(a),B=fd(b);return A.toLocaleDateString('es-MX',{day:'numeric',month:'short'})+' – '+B.toLocaleDateString('es-MX',{day:'numeric',month:'short',year:'numeric'})} function changeWeek(n){weekOffset+=n;render()} function thisWeek(){weekOffset=0;render()}
function weekHtml(){
  let [a,b]=weekBounds(weekOffset);
  let items=pending().filter(p=>p.date>=a&&p.date<=b);
  let total=items.reduce((sum,p)=>sum+p.amount,0);
  let title=weekOffset===0?'Esta semana':weekOffset===1?'Próxima semana':weekOffset===-1?'Semana anterior':'Semana seleccionada';
  return `<section class="weekbox"><div class="row"><div><b>${title}</b><div class="muted">${weekLabel(a,b)}</div></div><div style="text-align:right"><b>${mx(total)}</b><div class="tiny">${items.length} pago${items.length===1?'':'s'} pendiente${items.length===1?'':'s'}</div></div></div><div class="weeknav"><button class="btn soft" onclick="changeWeek(-1)">‹ Anterior</button>${weekOffset!==0?'<button class="btn soft" onclick="thisWeek()">Actual</button>':''}<button class="btn soft" onclick="changeWeek(1)">Siguiente ›</button></div>${items.length?items.map(payHtml).join(''):'<div class="empty">✓ Sin pagos pendientes esta semana.</div>'}</section>`;
}
function monthKey(d=today()){return d.slice(0,7)}
function monthLabel(k){let [y,m]=k.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('es-MX',{month:'long',year:'numeric'})}
function monthlyStats(){let k=monthKey(),ps=all().filter(p=>p.date.startsWith(k)),scheduled=ps.reduce((a,p)=>a+p.amount,0),paid=ps.filter(p=>p.paid).reduce((a,p)=>a+p.amount,0),pendingAmt=ps.filter(p=>!p.paid).reduce((a,p)=>a+p.amount,0);return {k,scheduled,paid,pendingAmt,count:ps.filter(p=>!p.paid).length}}
function overdue(){return pending().filter(p=>p.date<today())}
function exportBackup(){let data={app:'Mis Deudas',version:4,exportedAt:new Date().toISOString(),debts};let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='RESPALDO_MIS_DEUDAS_'+today()+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function chooseBackup(){document.getElementById('backupFile').click()}
function importBackup(input){let f=input.files&&input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x||!Array.isArray(x.debts))throw new Error();if(!confirm('¿Restaurar este respaldo? Reemplazará los datos actuales de la aplicación.'))return;debts=x.debts;save();alert('Respaldo restaurado correctamente.')}catch(e){alert('El archivo no es un respaldo válido de Mis Deudas.')}finally{input.value=''}};r.readAsText(f)}
function backupHtml(){return `<section class="backup"><div class="row"><div><b>Respaldo de información</b><div class="tiny">Guarda una copia antes de cambiar de celular o borrar datos del navegador.</div></div><span class="badge future">V4</span></div><div class="backupactions"><button class="btn soft" onclick="exportBackup()">↓ Crear respaldo</button><button class="btn primary" onclick="chooseBackup()">↑ Restaurar respaldo</button></div><input id="backupFile" type="file" accept="application/json,.json" class="hidden" onchange="importBackup(this)"></section>`}
function home(v){let ps=pending(),n=ps[0],m=monthlyStats(),late=overdue();v.innerHTML=`${late.length?`<section class="urgent"><div class="row"><div><b>⚠ ${late.length} pago${late.length>1?'s':''} vencido${late.length>1?'s':''}</b><div class="muted">Pendiente vencido: ${mx(late.reduce((a,p)=>a+p.amount,0))}</div></div><span class="badge late">ATENCIÓN</span></div>${late.slice(0,3).map(p=>`<div style="margin-top:9px" class="row"><span>${p.debt} · ${ds(p.date)}</span><b>${mx(p.amount)}</b></div>`).join('')}</section>`:''}<section class="monthly"><div class="row"><div><b style="text-transform:capitalize">Resumen · ${monthLabel(m.k)}</b><div class="muted">Control mensual de tus compromisos</div></div><span class="badge future">${m.count} pendientes</span></div><div class="monthstats"><div class="mstat"><small>Programado</small><b>${mx(m.scheduled)}</b></div><div class="mstat"><small>Pagado</small><b>${mx(m.paid)}</b></div><div class="mstat"><small>Pendiente</small><b>${mx(m.pendingAmt)}</b></div></div></section>${weekHtml()}<div class="cards"><div class="card"><small>Saldo total pendiente</small><b>${mx(ps.reduce((a,p)=>a+p.amount,0))}</b></div><div class="card"><small>Próximo pago</small><b>${n?mx(n.amount):'—'}</b><small>${n?n.debt+' · '+ds(n.date):'Sin pendientes'}</small></div></div><section class="section"><h2>Próximos pagos</h2>${ps.slice(0,8).map(payHtml).join('')||'<div class="empty">No tienes pagos pendientes.</div>'}</section>${backupHtml()}`}
function payHtml(p){let s=status(p);return `<div class="pay"><div class="row"><div><b>${p.debt}</b><div class="muted">${ds(p.date)}</div></div><div style="text-align:right"><div class="amount">${mx(p.amount)}</div><span class="badge ${s[1]}">${s[0]}</span></div></div>${!p.paid?`<div style="margin-top:10px;text-align:right"><button class="btn soft" onclick="markPaid('${p.debtId}','${p.id}')">Registrar pago</button></div>`:''}</div>`}
function debtView(v){v.innerHTML=`<section class="section"><div class="row" style="margin:10px 2px 4px"><h2 style="margin:0">Mis deudas</h2><button class="btn primary" onclick="openDebt()">+ Nueva deuda</button></div>${debts.map(d=>{let t=d.payments.reduce((s,p)=>s+p.amount,0),pd=d.payments.filter(p=>p.paid).reduce((s,p)=>s+p.amount,0),left=t-pd,pc=t?Math.round(pd/t*100):0;return `<div class="debt"><div class="row"><div><h3>${d.name}</h3><div class="muted">${d.payments.filter(p=>!p.paid).length} pagos pendientes</div></div><div class="amount">${mx(left)}</div></div><div class="progress"><i style="width:${pc}%"></i></div><div class="row" style="margin-top:10px"><span class="muted">${pc}% pagado · Total ${mx(t)}</span><div><button class="btn soft" onclick="openDebt('${d.id}')">Editar</button> <button class="btn primary" onclick="openPayment('${d.id}')">+ Pago</button></div></div></div>`}).join('')||'<div class="empty">Agrega tu primera deuda con el botón + Nueva deuda.</div>'}</section>`}
function calendar(v){let ps=pending();v.innerHTML=`<section class="section"><h2>Calendario de pagos</h2>${ps.map(payHtml).join('')||'<div class="empty">Sin pagos pendientes.</div>'}</section>`}
function history(v){let x=all().filter(p=>p.paid).sort((a,b)=>b.paidDate.localeCompare(a.paidDate));v.innerHTML=`<section class="section"><h2>Historial de pagos</h2>${x.map(p=>`<div class="pay"><div class="row"><div><b>${p.debt}</b><div class="muted">Vencía ${ds(p.date)} · Pagado ${ds(p.paidDate)}</div></div><div class="amount">${mx(p.amount)}</div></div></div>`).join('')||'<div class="empty">Aún no has registrado pagos.</div>'}</section>`}
function show(x){current=x;render()}
function modal(inner){document.getElementById('modal').className='modal';document.getElementById('modal').innerHTML=`<div class="sheet">${inner}</div>`} function closeM(){document.getElementById('modal').className='hidden';document.getElementById('modal').innerHTML=''}
function openDebt(id=''){let d=debts.find(x=>x.id===id);if(d){modal(`<h3>Editar deuda</h3><div class="field"><label>Nombre de la deuda</label><input id="dn" value="${d.name}"></div><div class="field"><label>Notas</label><textarea id="dnotes" placeholder="Opcional">${d.notes||''}</textarea></div><div class="hint">El calendario existente se conserva. Puedes agregar o modificar pagos desde la tarjeta de esta deuda.</div><div class="actions"><button class="btn soft" onclick="closeM()">Cancelar</button><button class="btn danger" onclick="delDebt('${id}')">Eliminar</button><button class="btn primary" onclick="saveDebt('${id}')">Guardar</button></div>`);return}modal(`<h3>Nueva deuda</h3><div class="field"><label>Nombre de la deuda</label><input id="dn" placeholder="Ej. Tarjeta, préstamo, mueblería..."></div><div class="grid2"><div class="field"><label>Número de pagos</label><input type="number" id="dcount" min="1" max="120" value="12"></div><div class="field"><label>Importe por pago</label><input type="number" id="damount" min="0.01" step="0.01" placeholder="0.00"></div></div><div class="grid2"><div class="field"><label>Primer pago</label><input type="date" id="dfirst" value="${today()}"></div><div class="field"><label>Frecuencia</label><select id="dfreq"><option value="weekly">Semanal</option><option value="biweekly">Quincenal</option><option value="monthly" selected>Mensual</option></select></div></div><div class="field"><label>Notas</label><textarea id="dnotes" placeholder="Opcional"></textarea></div><button class="btn soft" style="width:100%;padding:12px" onclick="generateSchedule()">Generar calendario</button><div id="schedulePreview"></div><div class="actions"><button class="btn soft" onclick="closeM()">Cancelar</button><button class="btn primary" onclick="saveGeneratedDebt()">Guardar deuda</button></div>`)}
function addMonthsSafe(dateStr,n){let [y,m,d]=dateStr.split('-').map(Number),target=m-1+n,yy=y+Math.floor(target/12),mm=((target%12)+12)%12,last=new Date(yy,mm+1,0).getDate(),dd=Math.min(d,last);return `${yy}-${String(mm+1).padStart(2,'0')}-${String(dd).padStart(2,'0')}`}
function addDays(dateStr,n){let x=fd(dateStr);x.setDate(x.getDate()+n);return iso(x)}
function generateSchedule(){let count=Math.max(1,Math.min(120,parseInt(document.getElementById('dcount').value)||0)),amount=parseFloat(document.getElementById('damount').value),first=document.getElementById('dfirst').value,freq=document.getElementById('dfreq').value,out=document.getElementById('schedulePreview');if(!first||!(amount>0)){out.innerHTML='<div class="notice" style="margin:10px 0">Captura el importe y la primera fecha de pago.</div>';return}let rows=[];for(let i=0;i<count;i++){let date=freq==='weekly'?addDays(first,i*7):freq==='biweekly'?addDays(first,i*15):addMonthsSafe(first,i);rows.push({date,amount})}out.innerHTML=`<div class="summarybar"><b>${count} pagos</b><b>Total ${mx(count*amount)}</b></div><div class="hint" style="margin:8px 2px">Puedes corregir una fecha o importe antes de guardar.</div><div class="schedule">${rows.map((r,i)=>`<div class="schedrow"><b>${i+1}</b><input type="date" class="gdate" value="${r.date}" aria-label="Fecha pago ${i+1}"><input type="number" class="gamount" min="0.01" step="0.01" value="${r.amount.toFixed(2)}" aria-label="Importe pago ${i+1}"></div>`).join('')}</div>`}
function saveGeneratedDebt(){let n=document.getElementById('dn').value.trim(),notes=document.getElementById('dnotes').value.trim(),dates=[...document.querySelectorAll('.gdate')],amounts=[...document.querySelectorAll('.gamount')];if(!n)return alert('Escribe el nombre de la deuda.');if(!dates.length)return alert('Primero genera el calendario de pagos.');let payments=[];for(let i=0;i<dates.length;i++){let a=parseFloat(amounts[i].value);if(!dates[i].value||!(a>0))return alert('Revisa las fechas e importes del calendario.');payments.push({id:'p'+Date.now()+'_'+i,date:dates[i].value,amount:a,paid:false,paidDate:''})}debts.push({id:'d'+Date.now(),name:n,notes,payments});closeM();save();current='debts';render()}
function saveDebt(id){let n=document.getElementById('dn').value.trim();if(!n)return alert('Escribe el nombre de la deuda.');let notes=document.getElementById('dnotes').value.trim(),d=debts.find(x=>x.id===id);d.name=n;d.notes=notes;closeM();save();current='debts';render()}
function delDebt(id){if(confirm('¿Eliminar esta deuda y todos sus pagos?')){debts=debts.filter(d=>d.id!==id);closeM();save()}}
function openPayment(id,pid=''){let d=debts.find(x=>x.id===id),p=d.payments.find(x=>x.id===pid);modal(`<h3>${p?'Editar':'Agregar'} pago · ${d.name}</h3><div class="grid2"><div class="field"><label>Fecha</label><input type="date" id="pd" value="${p?p.date:today()}"></div><div class="field"><label>Importe</label><input type="number" step="0.01" id="pa" value="${p?p.amount:''}" placeholder="0.00"></div></div><div class="actions"><button class="btn soft" onclick="closeM()">Cancelar</button>${p?`<button class="btn danger" onclick="delPayment('${id}','${pid}')">Eliminar</button>`:''}<button class="btn primary" onclick="savePayment('${id}','${pid}')">Guardar</button></div>`)}
function savePayment(id,pid){let d=debts.find(x=>x.id===id),date=document.getElementById('pd').value,amount=+document.getElementById('pa').value;if(!date||!amount)return alert('Captura fecha e importe.');if(pid){let p=d.payments.find(x=>x.id===pid);p.date=date;p.amount=amount}else d.payments.push({id:'p'+Date.now(),date,amount,paid:false,paidDate:''});closeM();save()}
function delPayment(id,pid){if(confirm('¿Eliminar este pago?')){let d=debts.find(x=>x.id===id);d.payments=d.payments.filter(p=>p.id!==pid);closeM();save()}}
function markPaid(id,pid){let d=debts.find(x=>x.id===id),p=d.payments.find(x=>x.id===pid);modal(`<h3>Registrar pago · ${d.name}</h3><div class="field"><label>Importe pagado</label><input type="number" step="0.01" id="paidAmount" value="${p.amount}"></div><div class="field"><label>Fecha de pago</label><input type="date" id="paidDate" value="${today()}"></div><div class="actions"><button class="btn soft" onclick="closeM()">Cancelar</button><button class="btn primary" onclick="confirmPaid('${id}','${pid}')">Confirmar pago</button></div>`)}
function confirmPaid(id,pid){let d=debts.find(x=>x.id===id),p=d.payments.find(x=>x.id===pid);p.amount=+document.getElementById('paidAmount').value||p.amount;p.paid=true;p.paidDate=document.getElementById('paidDate').value||today();closeM();save()}
function dayDiff(dateStr){let [y,m,d]=dateStr.split('-').map(Number),[ty,tm,td]=today().split('-').map(Number);return Math.round((Date.UTC(y,m-1,d)-Date.UTC(ty,tm-1,td))/86400000)}
function urgentPayments(){return pending().filter(p=>dayDiff(p.date)<=1)}
async function showAppNotification(title,body,tag='mis-deudas-aviso'){if(!('Notification'in window)||Notification.permission!=='granted')return false;try{if('serviceWorker'in navigator){let reg=await navigator.serviceWorker.ready;await reg.showNotification(title,{body,icon:'./icon-192.png',badge:'./icon-192.png',tag,renotify:true,data:{url:'./index.html'}});return true}}catch(e){}return false}
function notificationSummary(){let items=urgentPayments();if(!items.length)return null;let overdue=items.filter(p=>dayDiff(p.date)<0),todayItems=items.filter(p=>dayDiff(p.date)===0),tomorrow=items.filter(p=>dayDiff(p.date)===1),total=items.reduce((s,p)=>s+p.amount,0),parts=[];if(overdue.length)parts.push(`${overdue.length} vencido${overdue.length>1?'s':''}`);if(todayItems.length)parts.push(`${todayItems.length} vence${todayItems.length>1?'n':''} hoy`);if(tomorrow.length)parts.push(`${tomorrow.length} vence${tomorrow.length>1?'n':''} mañana`);return {items,title:'Mis Deudas · recordatorio',body:`${parts.join(' · ')} · ${mx(total)}`}}
async function checkDueNotifications(force=false){if(!('Notification'in window)||Notification.permission!=='granted')return;let s=notificationSummary();if(!s)return;let key='misDeudasNotif_'+today(),last=localStorage.getItem(key);if(force||last!=='sent'){if(await showAppNotification(s.title,s.body,force?'mis-deudas-prueba':'mis-deudas-'+today()))localStorage.setItem(key,'sent')}}
function alerts(){let due=pending().filter(p=>dayDiff(p.date)<=3),el=document.getElementById('notice'),perm=('Notification'in window)?Notification.permission:'unsupported';let state=perm==='granted'?'Notificaciones activadas':perm==='denied'?'Notificaciones bloqueadas':'Notificaciones desactivadas';let controls=perm==='default'?'<button class="btn soft" style="margin-top:8px" onclick="requestNotif()">Activar avisos</button>':perm==='granted'?'<button class="btn soft" style="margin-top:8px" onclick="testNotif()">Probar notificación</button>':'';let hint=perm==='granted'?'Avisos configurados para 1 día antes, el día del vencimiento y pagos vencidos. Esta versión los revisa al abrir o volver a la aplicación.':'Activa el permiso de Android para recibir avisos de Mis Deudas.';el.innerHTML=due.length?`<div class="notice"><b>🔔 ${due.length} pago${due.length>1?'s':''} requiere${due.length==1?'':'n'} atención.</b><div style="margin-top:5px">${state}</div>${controls}<div class="hint" style="margin-top:7px">${hint}</div></div>`:`<div class="noticegood"><b>✓ Sin vencimientos urgentes.</b><div class="hint" style="margin-top:4px">${state}</div>${controls}</div>`}
function requestNotif(){if(!('Notification'in window))return alert('Este navegador no permite notificaciones.');Notification.requestPermission().then(async x=>{render();if(x==='granted')await checkDueNotifications(true)})}
async function testNotif(){let s=notificationSummary(),body=s?s.body:'Las notificaciones de Mis Deudas están funcionando correctamente.';let ok=await showAppNotification('Mis Deudas · prueba',body,'mis-deudas-prueba-'+Date.now());if(!ok)alert('No se pudo mostrar la notificación. Revisa el permiso de notificaciones de Mis Deudas en Android.')}
window.addEventListener('focus',()=>checkDueNotifications(false));document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkDueNotifications(false)});setTimeout(()=>checkDueNotifications(false),1200);
render();</script>

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
